<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notes · UPSI-OS</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">SI</div>
      <div class="brand-text"><strong>UPSI-OS</strong><span>Duty Prep Console</span></div>
    </div>

    <nav class="nav-group">
      <span class="nav-label">Command</span>
      <a class="nav-link" href="index.html">
        <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg></span>
        <span>Dashboard</span>
      </a>
      <a class="nav-link" href="subjects.html">
        <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5v15Z"/><path d="M4 19.5V4.5"/><path d="M8 7h8M8 11h6"/></svg></span>
        <span>Subjects</span>
      </a>
      <a class="nav-link" href="planner.html">
        <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/><path d="m8.5 14 2 2 4-4"/></svg></span>
        <span>Planner</span>
      </a>
      <a class="nav-link" href="mock.html">
        <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 3v5h5M9 13l2 2 4-4"/></svg></span>
        <span>Mock Tracker</span>
      </a>
      <a class="nav-link active" href="notes.html">
        <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h13l3 3v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M8 10h8M8 14h5"/></svg></span>
        <span>Notes</span>
      </a>
    </nav>

    <nav class="nav-group">
      <span class="nav-label">System</span>
      <a class="nav-link" href="settings.html">
        <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l2-1.4-2-3.4-2.3.7a8 8 0 0 0-2.6-1.5L14 2h-4l-.5 2.4a8 8 0 0 0-2.6 1.5l-2.3-.7-2 3.4 2 1.4a7.9 7.9 0 0 0 0 3l-2 1.4 2 3.4 2.3-.7c.77.65 1.65 1.16 2.6 1.5L10 22h4l.5-2.4a8 8 0 0 0 2.6-1.5l2.3.7 2-3.4-2-1.4Z"/></svg></span>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="sidebar-collapse-btn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6M4 4v16"/></svg>
        <span class="collapse-label" style="margin-left:8px">Collapse</span>
      </button>
    </div>
  </aside>

  <header class="topbar">
    <div class="topbar-title">
      <h1>Notes</h1>
      <span class="breadcrumb">UPSI-OS / Knowledge Base</span>
    </div>
    <div class="topbar-actions">
      <span class="autosave-indicator" data-notes-autosave><span class="dot"></span><span>Autosave on</span></span>
      <button class="btn btn-primary btn-sm" data-new-note-btn>+ New Note</button>
    </div>
  </header>

  <main class="main page-fade">
    <div class="notes-layout">

      <div class="card notes-list-panel">
        <div class="topbar-search" style="min-width:0">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" placeholder="Search notes…" data-notes-search />
        </div>
        <div class="notes-list" data-notes-list></div>
      </div>

      <div class="card notes-editor-panel">
        <div class="notes-editor-head">
          <input type="text" placeholder="Untitled note" data-note-title-input />
          <select data-note-subject-tag style="max-width:220px"></select>
          <button class="btn btn-danger btn-icon" data-delete-note-btn title="Delete note">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
          </button>
        </div>

        <div class="notes-toolbar">
          <button data-format-cmd="bold" title="Bold"><b>B</b></button>
          <button data-format-cmd="italic" title="Italic"><i>I</i></button>
          <button data-format-cmd="underline" title="Underline"><u>U</u></button>
          <span class="sep"></span>
          <button data-format-cmd="insertUnorderedList" title="Bullet list">•</button>
          <button data-format-cmd="formatBlock" data-format-value="H3" title="Heading">H</button>
          <span class="sep"></span>
          <button data-format-cmd="justifyLeft" title="Align left">L</button>
          <button data-format-cmd="justifyCenter" title="Align center">C</button>
          <span class="sep"></span>
          <button data-format-cmd="removeFormat" title="Clear formatting">✕</button>
        </div>

        <div class="note-body" contenteditable="true" data-note-body data-placeholder="Start writing… formulas, mnemonics, current affairs digest, anything worth remembering."></div>
      </div>

    </div>
  </main>

  <footer class="statusbar" data-statusbar></footer>

</div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/notes.js"></script>
</body>
</html>
