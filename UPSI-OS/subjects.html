<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subjects · UPSI-OS</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">SI</div>
      <div class="brand-text"><strong>UPSI-OS</strong><span>Duty Prep Console</span></div>
    </div>

    <nav class="nav-group">
      <span class="nav-label">Command</span>
      <a class="nav-link" href="index.html">
        <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg></span>
        <span>Dashboard</span>
      </a>
      <a class="nav-link active" href="subjects.html">
        <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5v15Z"/><path d="M4 19.5V4.5"/><path d="M8 7h8M8 11h6"/></svg></span>
        <span>Subjects</span>
      </a>
      <a class="nav-link" href="planner.html">
        <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/><path d="m8.5 14 2 2 4-4"/></svg></span>
        <span>Planner</span>
      </a>
      <a class="nav-link" href="mock.html">
        <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 3v5h5M9 13l2 2 4-4"/></svg></span>
        <span>Mock Tracker</span>
      </a>
      <a class="nav-link" href="notes.html">
        <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h13l3 3v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M8 10h8M8 14h5"/></svg></span>
        <span>Notes</span>
      </a>
    </nav>

    <nav class="nav-group">
      <span class="nav-label">System</span>
      <a class="nav-link" href="settings.html">
        <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l2-1.4-2-3.4-2.3.7a8 8 0 0 0-2.6-1.5L14 2h-4l-.5 2.4a8 8 0 0 0-2.6 1.5l-2.3-.7-2 3.4 2 1.4a7.9 7.9 0 0 0 0 3l-2 1.4 2 3.4 2.3-.7c.77.65 1.65 1.16 2.6 1.5L10 22h4l.5-2.4a8 8 0 0 0 2.6-1.5l2.3.7 2-3.4-2-1.4Z"/></svg></span>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="sidebar-collapse-btn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6M4 4v16"/></svg>
        <span class="collapse-label" style="margin-left:8px">Collapse</span>
      </button>
    </div>
  </aside>

  <header class="topbar">
    <div class="topbar-title">
      <h1>Subjects</h1>
      <span class="breadcrumb">UPSI-OS / Syllabus Tracker</span>
    </div>
    <div class="topbar-actions">
      <div class="topbar-search" data-subject-search-wrap>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" placeholder="Search topics…" data-subject-search />
      </div>
      <button class="btn btn-primary btn-sm" data-add-subject-btn>+ Add Subject</button>
    </div>
  </header>

  <main class="main page-fade">

    <div class="flex items-center gap-2" style="flex-wrap:wrap;margin-bottom:var(--space-4)" data-subject-tabs></div>

    <div class="flex items-center gap-2" style="margin-bottom:var(--space-5)">
      <span class="text-muted mono" style="font-size:11px;margin-right:4px">PRIORITY</span>
      <span class="chip active" data-priority-filter="all">All</span>
      <span class="chip" data-priority-filter="high">High</span>
      <span class="chip" data-priority-filter="medium">Medium</span>
      <span class="chip" data-priority-filter="low">Low</span>
    </div>

    <div class="card" style="margin-bottom:var(--space-5)" data-subject-progress></div>

    <div data-topic-tree></div>

  </main>

  <footer class="statusbar" data-statusbar></footer>

</div>

<!-- Subtopic notes modal -->
<div class="modal-overlay" data-note-modal aria-hidden="true">
  <div class="modal">
    <div class="modal-head">
      <h3 data-note-modal-title>Subtopic notes</h3>
      <button class="btn btn-ghost btn-icon" data-close-modal>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="field">
      <label>Quick notes for this subtopic</label>
      <textarea data-note-modal-textarea rows="8" placeholder="Formulas, tricky points, sources to revisit…"></textarea>
    </div>
    <div class="flex gap-2" style="justify-content:flex-end">
      <button class="btn btn-ghost" data-close-modal>Cancel</button>
      <button class="btn btn-primary" data-note-modal-save>Save notes</button>
    </div>
  </div>
</div>

<!-- Add Subject modal -->
<div class="modal-overlay" data-add-subject-modal aria-hidden="true">
  <div class="modal">
    <div class="modal-head">
      <h3>Add a new subject</h3>
      <button class="btn btn-ghost btn-icon" data-close-modal>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="field">
      <label>Subject name</label>
      <input type="text" data-add-subject-name placeholder="e.g. Computer Awareness" />
    </div>
    <div class="field">
      <label>Accent color</label>
      <div class="color-swatch-row" data-add-subject-colors></div>
    </div>
    <div class="flex gap-2" style="justify-content:flex-end">
      <button class="btn btn-ghost" data-close-modal>Cancel</button>
      <button class="btn btn-primary" data-add-subject-save>Create subject</button>
    </div>
  </div>
</div>

<!-- Add Topic modal -->
<div class="modal-overlay" data-add-topic-modal aria-hidden="true">
  <div class="modal">
    <div class="modal-head">
      <h3>Add a new topic</h3>
      <button class="btn btn-ghost btn-icon" data-close-modal>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="field">
      <label>Topic name</label>
      <input type="text" data-add-topic-name placeholder="e.g. Static GK" />
    </div>
    <div class="field">
      <label>Priority</label>
      <select data-add-topic-priority>
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <div class="flex gap-2" style="justify-content:flex-end">
      <button class="btn btn-ghost" data-close-modal>Cancel</button>
      <button class="btn btn-primary" data-add-topic-save>Add topic</button>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/subjects.js"></script>
</body>
</html>
